<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Marketplace</title>
    <link
      rel="icon"
      type="image/png"
      href="./assets/bitcoin_logo_icon_170476.png"
    />
    <script
      src="https://kit.fontawesome.com/3919f5a8d1.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="browse.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav__row">
        <div class="logo">
          <img
            src="./assets/defi-decentralized-finance-for-exchange-cryptocurrency-defi-text-logo-design-finance-system-block-chain-and-walllet-blue-dark-technology-system-with-alt-coin-icon-vector.jpg"
            alt="DeFi logo"
            class="logo"
          />
        </div>
        <div class="nav__links">
          <a href="index.html" class="link__hover-effect">Home</a>
          <a href="#" class="link__hover-effect">Find Your Crypto</a>
          <a
            href="mailto:jacobpoole84@gmail.com"
            target="_blank"
            class="contact"
            >Contact</a
          >
        </div>
        <button
          class="btn__menu"
          onclick="openMenu()"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <span class="hamburger" aria-hidden="true">
            <span class="bar bar1"></span>
            <span class="bar bar2"></span>
            <span class="bar bar3"></span>
          </span>
        </button>
        <div class="menu__backdrop">
          <button class="btn__menu menu__close" onclick="closeMenu()">
            <i class="icon fa-solid fa-xmark"></i>
          </button>
          <ul class="menu__links">
            <li class="menu__list">
              <a href="index.html" class="menu__link" onclick="closeMenu()"
                >Home</a
              >
            </li>
            <li class="menu__list">
              <a href="./browse.html" class="menu__link" onclick="closeMenu()"
                >Search Your Crypto</a
              >
            </li>
            <li class="menu__list">
              <a
                href="mailto:jacobpoole84@gmail.com"
                target="_blank"
                class="menu__link"
                onclick="closeMenu()"
                >Contact</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="content__wrapper">
        <h1>Browse Your Coin</h1>
        <div class="input-wrap">
          <input type="text" id="search-details" placeholder="Search by Name or Symbol"/>
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass" onclick="renderCoin()"></i>
          </div>
        </div>
      </div>
      <div class="background-img"></div>
    </header>
    <section class="search">
      <div
        class="progress-inline"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-inline__fill"></div>
      </div>
      <div class="filter__wrapper">
        <h1 class="search__info">Search Results:</h1>
        <div class="price__filter">
          <h2>Coin Sort:</h2>
          <select id="filter" onchange="filterCoins(event)">
            <option value="" diabled selected></option>
            <option value="NAME_SORT">Sort by Name</option>
            <option value="SYMBOL_SORT">Sort by Symbol</option>
            <option value="RANK_SORT">Sort by Rank</option>
            <option value="PRICE_SORT">Sort by Price</option>
          </select>
        </div>
      </div>
      <div class="coin__container">
        <div class="coin__row">
          <div class="coin-info">
            <!-- <div class="coin-info__container">
              <h3>Coin Name</h3>
              <p><b>Symbol:</b> BTC</p>
              <p><b>Rank:</b> 1</p>
              <p><b>Price:</b> $22B</p>
            </div>
            <img src="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400" alt=""> -->
          </div>
          <h1 class="search__suggestion">Try Searching for a Coin by Name</h1>
        </div>
      </div>
    </section>
    <script src="browse.js"></script>
    <script src="index.js"></script>
  </body>
</html>
